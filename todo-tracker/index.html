<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To Do - hyein.exe</title>
<link rel="stylesheet" href="https://unpkg.com/98.css" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
    -webkit-font-smoothing: none;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
  }
  .window { width: 300px; margin: 10px; }
  .title-bar-text { display: flex; align-items: center; gap: 4px; }
  ul.tasks { list-style: none; margin: 4px 0; padding: 0; }
  ul.tasks li {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 2px; border-bottom: 1px dotted #b0b0b0; font-size: 12px;
  }
  .chk {
    width: 13px; height: 13px; border: 1px solid #808080; background: #fff;
    box-shadow: inset 1px 1px #000, inset -1px -1px #dfdfdf;
    flex: 0 0 auto; text-align: center; line-height: 12px; font-size: 11px;
  }
  .chk.done { background: #000080; color: #fff; }
  .chk.done::after { content: "✓"; }
  .task-title { flex: 1; }
  li.done .task-title { color: #808080; text-decoration: line-through; }
  .pri { width: 9px; height: 9px; border: 1px solid #555; flex: 0 0 auto; }
  .pri.높음 { background: #ff2020; }
  .pri.중간 { background: #ffd000; }
  .pri.낮음 { background: #b0b0b0; }
  .cat { font-size: 10px; color: #444; background: #dfdfdf; padding: 0 4px; border: 1px solid #b0b0b0; }
  .meta { font-size: 9px; color: #555; white-space: nowrap; }
  .empty { padding: 12px 4px; text-align: center; color: #555; font-size: 11px; }
  .sync { font-size: 10px; color: #555; text-align: right; margin-top: 6px; }
</style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">📋 To Do — hyein.exe</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="status-bar" style="margin:0 0 6px;">
        <p class="status-bar-field" style="flex:1;">할 일 <span id="left">0</span>개 남음</p>
        <p class="status-bar-field" style="flex:1;text-align:right;">완료 <span id="done">0</span></p>
      </div>
      <ul class="tasks" id="list"></ul>
      <div class="sync" id="sync">동기화 대기 중…</div>
    </div>
  </div>
<script>
  async function load() {
    let data;
    try { data = await (await fetch("./data.json?t=" + Date.now())).json(); }
    catch { data = { rows: [], updatedAt: null }; document.getElementById("sync").textContent = "data.json 로드 실패"; return; }
    render(data);
  }
  function render(data) {
    const list = document.getElementById("list");
    list.innerHTML = "";
    let done = 0, left = 0;
    const today = new Date().toISOString().slice(0, 10);
    const rows = data.rows || [];
    done = rows.filter(t => t.done && t.date === today).length;
    const visible = rows
      .filter(t => !t.done && (!t.date || t.date <= today))
      .slice(0, 7);
    visible.forEach(t => {
      left++;
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      li.innerHTML =
        `<span class="chk ${t.done ? "done" : ""}"></span>` +
        (t.priority ? `<span class="pri ${t.priority}" title="${t.priority}"></span>` : "") +
        `<span class="task-title"></span>` +
        (t.estimatedMinutes ? `<span class="meta">${t.estimatedMinutes}m</span>` : "") +
        (t.category ? `<span class="cat"></span>` : "");
      li.querySelector(".task-title").textContent = t.title;
      if (t.category) li.querySelector(".cat").textContent = t.category;
      list.appendChild(li);
    });
    if (!visible.length) {
      list.innerHTML = '<li class="empty">오늘 남은 할 일이 없습니다.</li>';
    }
    document.getElementById("left").textContent = left;
    document.getElementById("done").textContent = done;
    const when = data.updatedAt ? new Date(data.updatedAt).toLocaleString("ko-KR") : "—";
    document.getElementById("sync").textContent = "🔄 " + when + " (입력은 노션에서)";
  }
  load();
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
