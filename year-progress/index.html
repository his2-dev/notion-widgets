<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Year Progress - hyein.exe</title>
<link rel="stylesheet" href="https://unpkg.com/98.css" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
  }
  .window { width: 320px; margin: 10px; }
  .year { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .year strong { font-size: 20px; }
  .bar-outer { height: 22px; border: 2px inset #fff; background: #fff; position: relative; }
  .bar-inner {
    height: 100%; width: 0; background: repeating-linear-gradient(
      90deg, #800080 0, #800080 8px, #ff00ff 8px, #ff00ff 10px);
  }
  .bar-label { position: absolute; inset: 0; text-align: center; line-height: 22px; font-size: 11px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
  .stat { padding: 5px 3px; border: 2px inset #fff; background: #fff; text-align: center; font-size: 10px; }
  .stat b { display: block; margin-top: 2px; font-size: 12px; }
  .quote { margin: 7px 0 0; text-align: center; font-size: 10px; color: #444; }
</style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">📊 2026 Progress - hyein.exe</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <div class="year"><strong>2026</strong><span id="date"></span></div>
      <div class="bar-outer">
        <div class="bar-inner" id="bar"></div>
        <div class="bar-label" id="label"></div>
      </div>
      <div class="stats">
        <div class="stat">지난 날<b id="elapsed"></b></div>
        <div class="stat">남은 날<b id="remaining"></b></div>
        <div class="stat">이번 주<b id="week"></b></div>
      </div>
      <p class="quote">작게 기록하고, 꾸준히 앞으로.</p>
    </div>
  </div>
<script>
  function render() {
    const now = new Date();
    const year = now.getFullYear();
    const start = new Date(year, 0, 1);
    const end = new Date(year + 1, 0, 1);
    const elapsed = Math.floor((now - start) / 86400000) + 1;
    const total = Math.round((end - start) / 86400000);
    const remaining = total - elapsed;
    const percent = Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
    const week = Math.ceil(elapsed / 7);
    document.getElementById("date").textContent =
      now.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    document.getElementById("bar").style.width = percent.toFixed(1) + "%";
    document.getElementById("label").textContent = percent.toFixed(1) + "%";
    document.getElementById("elapsed").textContent = elapsed + "일";
    document.getElementById("remaining").textContent = remaining + "일";
    document.getElementById("week").textContent = week + "주차";
  }
  render();
</script>
</body>
</html>
