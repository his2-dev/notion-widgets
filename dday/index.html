<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D-Day - hyein.exe</title>
<link rel="stylesheet" href="https://unpkg.com/98.css" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Pixelated MS Sans Serif", Arial, sans-serif;
    -webkit-font-smoothing: none;
    display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
  }
  .window { width: 260px; margin: 10px; }
  ul.dlist { list-style: none; margin: 4px 0; padding: 0; }
  ul.dlist li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 4px; border-bottom: 1px dotted #b0b0b0; font-size: 12px;
  }
  .label { flex: 1; }
  .sub { color: #666; font-size: 10px; }
  .badge {
    font-weight: bold; padding: 1px 6px; border: 2px outset #dfdfdf;
    background: #c0c0c0; min-width: 44px; text-align: center;
  }
  .badge.soon { background: #ffe0e0; color: #c00000; }
  .badge.today { background: #000080; color: #fff; }
  .badge.past { color: #888; }
</style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">⏳ D-Day — hyein.exe</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <ul class="dlist" id="list"></ul>
      <p class="sub" style="text-align:right;margin:4px 0 0;">날짜 수정: index.html 의 EVENTS</p>
    </div>
  </div>
<script>
  // ▼▼ 여기만 고치면 됩니다 (이름, 날짜 YYYY-MM-DD) ▼▼
  const EVENTS = [
    { name: "영어 챌린지 시즌1 종료", date: "2026-09-04" },
    { name: "정규직 합격 목표",       date: "2026-09-30" },
    { name: "OPIc 시험",            date: "2026-07-15" },
  ];
  // ▲▲ ───────────────────────────────── ▲▲

  function daysBetween(target) {
    const t = new Date(target + "T00:00:00");
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.round((t - now) / 86400000);
  }
  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    EVENTS.map(e => ({ ...e, d: daysBetween(e.date) }))
      .sort((a, b) => (a.d < 0) - (b.d < 0) || Math.abs(a.d) - Math.abs(b.d))
      .forEach(e => {
        let txt, cls;
        if (e.d > 0)      { txt = "D-" + e.d;  cls = e.d <= 7 ? "soon" : ""; }
        else if (e.d === 0){ txt = "D-DAY";    cls = "today"; }
        else              { txt = "D+" + (-e.d); cls = "past"; }
        const li = document.createElement("li");
        li.innerHTML = `<span class="label"><b></b><br><span class="sub"></span></span><span class="badge ${cls}">${txt}</span>`;
        li.querySelector("b").textContent = e.name;
        li.querySelector(".sub").textContent = e.date;
        list.appendChild(li);
      });
  }
  render(); setInterval(render, 60 * 60 * 1000);
</script>
</body>
</html>
