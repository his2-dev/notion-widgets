name: Sync Notion → data.json

on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (UTC). 습관 시각화엔 충분.
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼
    inputs:
      seed_date:
        description: "백필할 날짜 (YYYY-MM-DD). 비우면 오늘."
        required: false
        default: ""
  push:
    branches: [main]
    paths: [scripts/sync.mjs, scripts/seed-habit.mjs, .github/workflows/sync.yml]

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 액션 런타임을 Node24로 (deprecation 경고 해소)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Seed today's habit row
        continue-on-error: true   # 생성 실패(권한 등)해도 위젯 sync는 계속 진행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SEED_DATE: ${{ github.event.inputs.seed_date }}
        run: node scripts/seed-habit.mjs

      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- habit-tracker/data.json todo-tracker/data.json; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git add habit-tracker/data.json todo-tracker/data.json
            git commit -m "chore: sync notion data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
